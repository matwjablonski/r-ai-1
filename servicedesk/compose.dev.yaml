services:
  backend:
    image: servicedesk-api-dev:local
    build:
      context: ./backend
      target: dev
    volumes:
      - ./backend:/src
      - backend_obj:/src/obj
      - backend_bin:/src/bin
    entrypoint: []
    command: ["dotnet", "watch", "run", "--no-launch-profile", "--urls", "http://0.0.0.0:8080"]
  frontend:
    build:
      context: ./frontend
      target: dev
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3000"]

volumes:
  backend_obj:
  backend_bin:
  frontend_modules:
